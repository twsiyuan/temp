const feed=document.getElementById('feed'), rootSel=document.getElementById('root'),
      pubSel=document.getElementById('pub'), movedBox=document.getElementById('onlymoved'),
      countEl=document.getElementById('count'), emptyEl=document.getElementById('empty');

const roots=[...new Set(ITEMS.flatMap(i=>i.tax.filter(c=>!c.includes('-'))))].sort();
const pubs=[...new Set(ITEMS.map(i=>i.pub))].sort();
for(const r of roots) rootSel.add(new Option(r.replace(/_/g,' '), r));
for(const p of pubs)  pubSel.add(new Option(p, p));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs=d=>{const m=/^(\d+)s$/.exec(d||''); if(!m) return d||'';
  const n=+m[1]; return (n<60? n+'s' : Math.floor(n/60)+':'+String(n%60).padStart(2,'0'));};

function delta(i){
  if(i.was==null) return `<span class="rounded bg-violet-100 px-1.5 py-0.5 font-mono text-[11px] text-violet-700 dark:bg-violet-900/60 dark:text-violet-200">new</span>`;
  const d=i.was-i.rank;
  if(d>0) return `<span class="rounded bg-emerald-100 px-1.5 py-0.5 font-mono text-[11px] text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-200">&uarr;${d} (was #${i.was})</span>`;
  if(d<0) return `<span class="rounded bg-rose-100 px-1.5 py-0.5 font-mono text-[11px] text-rose-700 dark:bg-rose-900/60 dark:text-rose-200">&darr;${-d} (was #${i.was})</span>`;
  return `<span class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[11px] text-slate-500 dark:bg-slate-800 dark:text-slate-400">&ndash; unchanged</span>`;
}

function row(i){
  const tax=i.tax.map(c=>{
    const sp=(c==='sports'||c.startsWith('sports-'));
    return `<span class="rounded px-1.5 py-0.5 font-mono text-[11px] ${sp
      ? 'bg-amber-100 text-amber-800 ring-1 ring-amber-300 dark:bg-amber-900/50 dark:text-amber-200 dark:ring-amber-800'
      : 'bg-sky-50 text-sky-700 ring-1 ring-sky-200 dark:bg-sky-950 dark:text-sky-300 dark:ring-sky-900'}">${esc(c)}</span>`;
  }).join('');
  const tag=i.tag.map(c=>`<span class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-[11px] text-slate-500 dark:bg-slate-800 dark:text-slate-400">${esc(c)}</span>`).join('');
  return `<article class="group flex flex-col gap-4 py-5 sm:flex-row">
    <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer"
       class="relative block w-full shrink-0 overflow-hidden rounded-xl bg-slate-200 sm:w-[360px] dark:bg-slate-800">
      <div class="aspect-video w-full">
        <img src="${esc(i.img)}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]">
      </div>
      <span class="absolute left-2 top-2 rounded bg-black/70 px-1.5 py-0.5 font-mono text-[11px] text-white">#${i.rank}</span>
      ${i.dur?`<span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-0.5 font-mono text-[11px] text-white">${esc(secs(i.dur))}</span>`:''}
    </a>
    <div class="flex min-w-0 flex-col gap-2">
      <a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer"
         class="clamp2 text-lg font-medium leading-snug hover:text-sky-600 hover:underline dark:hover:text-sky-400">${esc(i.title)}</a>
      <div class="flex flex-wrap items-center gap-2 text-sm text-slate-500 dark:text-slate-400">
        <span>${esc(i.pub)}</span>${delta(i)}
      </div>
      <div class="flex flex-wrap gap-1 pt-0.5">${tax}${tag}</div>
    </div>
  </article>`;
}

function render(){
  const r=rootSel.value, p=pubSel.value, mv=movedBox.checked;
  const out=ITEMS.filter(i=>{
    if(p && i.pub!==p) return false;
    if(r && !i.tax.some(c=>c===r||c.startsWith(r+'-'))) return false;
    if(mv && !(i.was!=null && i.was>i.rank)) return false;
    return true;
  });
  feed.innerHTML=out.map(row).join('');
  emptyEl.classList.toggle('hidden', out.length>0);
  countEl.textContent=`${out.length} of ${ITEMS.length} clips`;
}
[rootSel,pubSel].forEach(e=>e.addEventListener('change',render));
movedBox.addEventListener('change',render);
render();
</script>
